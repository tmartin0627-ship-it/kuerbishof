<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kürbishof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--o:#f08a1c;--cream:#fff4de;--brown:#4a2a10}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#78b04a;font-family:'Fredoka',system-ui,sans-serif;color:var(--brown);-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
.btn{font:600 18px 'Fredoka',system-ui,sans-serif;border:0;border-radius:16px;padding:11px 20px;color:#fff;background:linear-gradient(#ffa63d,#e8710a);box-shadow:0 5px 0 #a8500a,0 9px 16px rgba(0,0,0,.25);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8500a}
.btn.green{background:linear-gradient(#85c94f,#4f8a2c);box-shadow:0 5px 0 #356a1a,0 9px 16px rgba(0,0,0,.25)}
.btn.cream{background:linear-gradient(#fffaf0,#f1deb8);color:var(--brown);text-shadow:none;box-shadow:0 5px 0 #c9ab72,0 9px 16px rgba(0,0,0,.2)}
.btn.sel{background:linear-gradient(#85c94f,#4f8a2c);box-shadow:0 5px 0 #356a1a,0 0 0 3px #fff}
.btn.sm{padding:8px 13px;font-size:16px;border-radius:13px}
.btn:disabled{opacity:.5}
/* Lobby */
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(40,20,0,.45))}
.card{width:min(520px,100%);max-height:100%;overflow:auto;background:linear-gradient(#fff8e8,#fbe8c4);border:6px solid #7a4a22;border-radius:28px;padding:22px 24px;text-align:center;box-shadow:0 10px 0 #4e2f14,0 24px 50px rgba(0,0,0,.45)}
h1{margin:0;font-size:clamp(40px,9vw,64px);line-height:1;color:#f08a1c;-webkit-text-stroke:2px #5a2c08;paint-order:stroke fill;text-shadow:0 4px 0 #5a2c08;letter-spacing:1px}
.sub{margin:6px 0 14px;font-size:18px;opacity:.85}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
input{font:600 20px 'Fredoka',system-ui,sans-serif;padding:11px 14px;border-radius:14px;border:3px solid #b98a55;background:#fff;color:var(--brown);text-align:center;width:100%;-webkit-user-select:text;user-select:text;outline:none}
input:focus{border-color:var(--o)}
#code{width:150px;text-transform:uppercase;letter-spacing:6px}
#prev{background:radial-gradient(circle at 50% 70%,#cfe9a2,#9ccb62);border-radius:22px;border:4px solid #7a4a22}
#status{min-height:24px;font-size:16px;color:#a33;margin-top:6px}
.lab{font-size:14px;opacity:.7;margin-top:2px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(255,248,232,.92);border:3px solid #7a4a22;border-radius:16px;padding:6px 12px;font-weight:600;box-shadow:0 4px 0 rgba(78,47,20,.8);cursor:pointer}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:55vw;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,248,232,.92);border:2px solid #7a4a22;border-radius:14px;padding:3px 10px 3px 4px;font-size:15px;font-weight:600}
.chip i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
#left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;pointer-events:none}
#bottom>*{pointer-events:auto}
#emotes{position:fixed;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#emotes .btn{padding:6px 12px;font-size:15px}
.panel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,248,232,.94);border:4px solid #7a4a22;border-radius:20px;padding:10px 12px;box-shadow:0 6px 0 rgba(78,47,20,.8);max-width:min(900px,100%)}
#mzinfo{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(255,248,232,.94);border:3px solid #7a4a22;border-radius:16px;padding:6px 16px;font-weight:600;font-size:18px;text-align:center;pointer-events:none}
#dpad{position:fixed;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,58px);gap:6px}
#dpad button{height:58px;padding:0;font-size:24px}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(60,30,10,.9);color:#fff;padding:12px 22px;border-radius:18px;font-size:22px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
.sc-row{display:flex;align-items:center;gap:6px}
.sc-row b{min-width:76px;text-align:right;font-size:15px}
.sc-row span{min-width:96px;font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="lobby">
  <div class="card">
    <h1>Kürbishof</h1>
    <p class="sub">Gemeinsam auf dem Kürbishof spielen</p>
    <canvas id="prev" width="140" height="170"></canvas>
    <div class="row">
      <button class="btn sm cream" id="hatPrev">‹</button><span>Hut</span><button class="btn sm cream" id="hatNext">›</button>
      <button class="btn sm cream" id="colPrev">‹</button><span>Mantel</span><button class="btn sm cream" id="colNext">›</button>
    </div>
    <input id="name" maxlength="14" placeholder="Ihr Name" autocomplete="off">
    <div class="row"><button class="btn" id="hostBtn">Neuen Hof eröffnen</button></div>
    <div class="lab">oder einem Hof beitreten:</div>
    <div class="row"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off"><button class="btn green" id="joinBtn">Beitreten</button></div>
    <div id="status"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="left">
    <div class="pill" id="roomPill" title="Zum Kopieren des Einladungslinks tippen"></div>
    <button class="btn sm cream hidden" id="homeBtn">Zurück zum Hof</button>
  </div>
  <div id="chips"></div>
</div>
<div id="mzinfo" class="hidden"></div>
<div id="emotes" class="hidden"></div>
<div id="bottom" class="hidden">
  <button class="btn" id="goBtn" style="display:none;font-size:22px"></button>
  <div class="panel hidden" id="pCarve"></div>
  <div class="panel hidden" id="pScare"></div>
</div>
<div id="dpad" class="hidden">
  <span></span><button class="btn" data-d="up">▲</button><span></span>
  <button class="btn" data-d="left">◀</button><button class="btn" data-d="down">▼</button><button class="btn" data-d="right">▶</button>
</div>
<div id="toast"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>clamp(Math.round(amt>0?v+(255-v)*amt/100:v*(1+amt/100)),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function lg(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}

/* ================= Zeichen-Bausteine ================= */
const COATS=['#d9482b','#2f7fc1','#3e9b4f','#8a56c7','#e0a21b','#d9578f','#2c8f8f','#6b4a2f'];
const HAT_N=['Strohhut','Zylinder','Hexenhut','Mütze','Kürbismütze','Blumenkranz'];

function pumpkin(c,x,y,r,o={}){
  const col=o.col||'#f0861c',dark=o.dark,ry=r*.85;
  if(!o.noShadow){c.fillStyle='rgba(25,40,10,.3)';c.beginPath();c.ellipse(x+r*.12,y+ry*.92,r*1.05,r*.26,0,0,TAU);c.fill()}
  [[-.62,.8],[.62,.8],[-.32,.93],[.32,.93],[0,1]].forEach(([k,s])=>{
    const lx=x+k*r*.95,rx=r*.58,lry=ry*s;
    const g=c.createRadialGradient(lx-rx*.35,y-lry*.35,rx*.1,lx,y,Math.max(rx,lry)*1.08);
    g.addColorStop(0,shade(col,dark?-12:40));g.addColorStop(.55,shade(col,dark?-45:0));g.addColorStop(1,shade(col,-55));
    c.fillStyle=g;c.beginPath();c.ellipse(lx,y,rx,lry,0,0,TAU);c.fill();
    c.strokeStyle='rgba(80,30,0,.3)';c.lineWidth=Math.max(1,r*.022);c.stroke();
  });
  const sy=y-ry*.98;
  c.fillStyle=lg(c,x-r*.15,0,x+r*.2,0,[[0,'#8a6a30'],[1,'#4e3a18']]);
  c.beginPath();c.moveTo(x-r*.13,sy+r*.07);c.quadraticCurveTo(x-r*.12,sy-r*.28,x+r*.1,sy-r*.36);c.lineTo(x+r*.22,sy-r*.28);c.quadraticCurveTo(x+r*.06,sy-r*.18,x+r*.14,sy+r*.07);c.closePath();c.fill();
  if(!dark){c.strokeStyle='#5f8a2a';c.lineWidth=Math.max(1.5,r*.05);c.lineCap='round';c.beginPath();c.moveTo(x+r*.1,sy-r*.05);c.bezierCurveTo(x+r*.5,sy-r*.1,x+r*.45,sy+r*.25,x+r*.3,sy+r*.15);c.stroke();}
  if(!dark){c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.ellipse(x-r*.38,y-ry*.38,r*.17,ry*.3,-.5,0,TAU);c.fill()}
}
const SHAPES={
  eye:c=>{c.moveTo(0,-30);c.lineTo(34,26);c.lineTo(-34,26)},
  round:c=>{c.arc(0,0,27,0,TAU)},
  nose:c=>{c.moveTo(0,-18);c.lineTo(19,18);c.lineTo(-19,18)},
  mouth:c=>{const n=7,w=112;c.moveTo(-w,-14);for(let i=0;i<=n;i++)c.lineTo(-w+i*2*w/n,i%2?-34:-14);for(let i=n;i>=0;i--)c.lineTo(-w+i*2*w/n,i%2?16:36)},
  smile:c=>{c.arc(0,-70,115,.2*Math.PI,.8*Math.PI);c.arc(0,-85,100,.8*Math.PI,.2*Math.PI,true)},
  star:c=>{for(let i=0;i<10;i++){const r=i%2?17:42,a=i*Math.PI/5-Math.PI/2;c.lineTo(r*Math.cos(a),r*Math.sin(a))}},
  heart:c=>{c.moveTo(0,26);c.bezierCurveTo(-52,-6,-30,-44,0,-20);c.bezierCurveTo(30,-44,52,-6,0,26)}
};
const TOOLS=[['eye','Dreiecksauge'],['round','Rundauge'],['nose','Nase'],['mouth','Zackenmund'],['smile','Lächeln'],['star','Stern'],['heart','Herz'],['free','Freihand']];
function shapeFill(c,k,x,y,z){c.save();c.translate(x,y);c.scale(z,z);c.beginPath();SHAPES[k](c);c.closePath();c.fill();c.restore()}

function hat(c,k){
  if(k===0){c.fillStyle='#d6ac52';c.beginPath();c.ellipse(0,-60,26,7.5,0,0,TAU);c.fill();c.strokeStyle='#a67c2c';c.lineWidth=1.2;c.stroke();
    c.fillStyle=lg(c,0,-78,0,-58,[[0,'#f3d283'],[1,'#d1a74c']]);c.beginPath();c.moveTo(-14,-60);c.quadraticCurveTo(-15,-79,0,-79);c.quadraticCurveTo(15,-79,14,-60);c.closePath();c.fill();c.stroke();
    c.fillStyle='#c0392b';c.fillRect(-14,-66,28,5)}
  else if(k===1){c.fillStyle='#222';c.beginPath();c.ellipse(0,-62,22,6,0,0,TAU);c.fill();rr(c,-13,-90,26,29,3);c.fill();c.fillStyle='#f08a1c';c.fillRect(-13,-70,26,6);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(-9,-88,4,22)}
  else if(k===2){c.fillStyle='#4b2a7a';c.beginPath();c.ellipse(0,-61,24,6.5,0,0,TAU);c.fill();c.fillStyle=lg(c,-14,0,14,0,[[0,'#6a3fa6'],[1,'#3a1f63']]);
    c.beginPath();c.moveTo(-14,-62);c.quadraticCurveTo(-6,-72,2,-92);c.quadraticCurveTo(8,-80,14,-62);c.closePath();c.fill();c.fillStyle='#e8b923';c.fillRect(-13,-70,26,5)}
  else if(k===3){c.fillStyle=lg(c,-16,-72,16,-60,[[0,'#4a9b4e'],[1,'#2f6b34']]);c.beginPath();c.arc(0,-60,16.5,Math.PI,TAU);c.closePath();c.fill();
    c.fillStyle='#2f6b34';c.beginPath();c.ellipse(11,-59,13,4,0,0,TAU);c.fill();c.fillStyle='#f4e9cf';c.beginPath();c.arc(0,-77,3.2,0,TAU);c.fill()}
  else if(k===4){pumpkin(c,0,-70,12,{noShadow:true})}
  else{for(let i=0;i<7;i++){const a=Math.PI+i*Math.PI/6,x=Math.cos(a)*16,y=-50+Math.sin(a)*16;
      c.fillStyle=['#f4d03f','#e8719a','#fff','#9b6bd1'][i%4];for(let p=0;p<6;p++){c.beginPath();c.ellipse(x+Math.cos(p*1.05)*3.4,y+Math.sin(p*1.05)*3.4,2.5,2.5,0,0,TAU);c.fill()}
      c.fillStyle='#e8a317';c.beginPath();c.arc(x,y,2,0,TAU);c.fill()}}
}
function drawChar(c,x,y,o){
  const s=o.s||1,d=o.d||1,t=o.t||0,bob=o.moving?Math.abs(Math.sin(t*12))*3:Math.sin(t*2.5)*.8,step=o.moving?Math.sin(t*12)*5:0;
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(20,30,10,.32)';c.beginPath();c.ellipse(0,2,18,6.5,0,0,TAU);c.fill();
  c.translate(0,-bob);
  c.fillStyle='#4a2c14';c.beginPath();c.ellipse(-7,-1+step*.4,6.5,4,0,0,TAU);c.ellipse(7,-1-step*.4,6.5,4,0,0,TAU);c.fill();
  const col=COATS[(o.col||0)%COATS.length];
  c.fillStyle=lg(c,-15,-38,15,-4,[[0,shade(col,30)],[1,shade(col,-28)]]);rr(c,-14,-36,28,34,12);c.fill();
  c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1.2;c.stroke();
  c.fillStyle='rgba(0,0,0,.22)';c.fillRect(-14,-19,28,4);c.fillStyle='#ffd45e';c.fillRect(-3,-20,6,6);
  c.fillStyle='#f0bf93';c.beginPath();c.arc(-16,-18+step*.3,4.6,0,TAU);c.arc(16,-18-step*.3,4.6,0,TAU);c.fill();
  const g=c.createRadialGradient(-5,-56,2,0,-50,18);g.addColorStop(0,'#ffe6c8');g.addColorStop(1,'#eab07c');
  c.fillStyle=g;c.beginPath();c.arc(0,-50,16,0,TAU);c.fill();c.strokeStyle='rgba(120,60,20,.35)';c.lineWidth=1.2;c.stroke();
  const ex=d*2.2;
  c.fillStyle='#2b1a0e';c.beginPath();c.arc(-5.5+ex,-51,2.2,0,TAU);c.arc(5.5+ex,-51,2.2,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(-4.8+ex,-51.8,.8,0,TAU);c.arc(6.2+ex,-51.8,.8,0,TAU);c.fill();
  c.fillStyle='rgba(240,100,100,.4)';c.beginPath();c.arc(-9.5+ex*.4,-46,3.2,0,TAU);c.arc(9.5+ex*.4,-46,3.2,0,TAU);c.fill();
  c.strokeStyle='#8a3a22';c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.arc(ex*.6,-48.5,4.2,.15*Math.PI,.85*Math.PI);c.stroke();
  hat(c,(o.hat||0)%6);
  c.restore();
}
function nameTag(c,x,y,name,say){
  c.font="600 14px 'Fredoka',system-ui,sans-serif";c.textAlign='center';c.textBaseline='middle';
  const w=c.measureText(name).width+16;
  c.fillStyle='rgba(60,30,10,.78)';rr(c,x-w/2,y-11,w,22,11);c.fill();c.fillStyle='#fff';c.fillText(name,x,y+.5);
  if(say){c.font="600 16px 'Fredoka',system-ui,sans-serif";const sw=c.measureText(say).width+22;
    c.fillStyle='#fff';c.strokeStyle='#7a4a22';c.lineWidth=2.5;rr(c,x-sw/2,y-52,sw,28,14);c.fill();c.stroke();
    c.beginPath();c.moveTo(x-6,y-25);c.lineTo(x,y-16);c.lineTo(x+6,y-25);c.fillStyle='#fff';c.fill();c.fillStyle=getComputedStyle(document.body).color;c.fillText(say,x,y-37)}
}
function lantern(c,x,y,t,glow=1){
  const f=.85+.15*Math.sin(t*9+x);
  const g=c.createRadialGradient(x,y,2,x,y,40*glow);g.addColorStop(0,`rgba(255,210,90,${.7*f})`);g.addColorStop(1,'rgba(255,170,40,0)');c.fillStyle=g;c.fillRect(x-45,y-45,90,90);
  c.strokeStyle='#3a2a18';c.lineWidth=2;c.beginPath();c.arc(x,y-11,7,Math.PI,TAU);c.stroke();
  c.fillStyle='#3a2a18';rr(c,x-8,y-12,16,4,2);c.fill();rr(c,x-8,y+7,16,3.5,2);c.fill();
  c.fillStyle=lg(c,x-7,y-8,x+7,y+8,[[0,'#fff0a8'],[1,'#ffb42e']]);rr(c,x-6.5,y-8,13,15,3);c.fill();c.strokeStyle='#3a2a18';c.lineWidth=1.2;c.stroke();
  c.beginPath();c.moveTo(x,y-8);c.lineTo(x,y+7);c.stroke();
}
function straw(c,x,y,dx,dy,n,len){c.strokeStyle='#e3c155';c.lineWidth=2.2;c.lineCap='round';
  for(let i=0;i<n;i++){const a=Math.atan2(dy,dx)+(i-(n-1)/2)*.28;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*len*(.8+.2*((i*7)%3)),y+Math.sin(a)*len*(.8+.2*((i*7)%3)));c.stroke()}}

/* ---------- Vogelscheuche ---------- */
const SC_HAT=['Strohhut','Zylinder','Hexenhut','Schiebermütze','Kürbismütze','Blumenkranz'];
const SC_FACE=['Fröhlich','Zwinkernd','Staunend','Grinsend','Verschlafen','Schnurrbart'];
const SC_SHIRT=['#d64a3a','#3b7ec4','#4a9b4e','#8b5bc7','#e8a31d','#d2638f'], SC_SHIRT_N=['Rot','Blau','Grün','Lila','Gelb','Rosa'];
const SC_ACC=['Nichts','Schal','Fliege','Sonnenblume','Krähe','Laterne'];
function sunflower(c,x,y,r){for(let i=0;i<12;i++){const a=i*TAU/12;c.fillStyle=i%2?'#f6c928':'#ffd84d';c.beginPath();c.ellipse(x+Math.cos(a)*r*.7,y+Math.sin(a)*r*.7,r*.45,r*.2,a,0,TAU);c.fill()}
  c.fillStyle='#6b3d14';c.beginPath();c.arc(x,y,r*.45,0,TAU);c.fill();c.fillStyle='#8a5522';c.beginPath();c.arc(x-r*.1,y-r*.1,r*.2,0,TAU);c.fill()}
function scarecrow(c,x,y,s,L,t){
  const sway=Math.sin(t*1.7)*.035;
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(20,30,10,.3)';c.beginPath();c.ellipse(0,4,52,10,0,0,TAU);c.fill();
  c.fillStyle=lg(c,-6,0,6,0,[[0,'#8d6030'],[1,'#5f3f1c']]);rr(c,-5,-232,10,238,3);c.fill();
  c.fillStyle=lg(c,0,-100,0,-20,[[0,'#5a7cab'],[1,'#3a547c']]);rr(c,-27,-102,25,80,9);c.fill();rr(c,2,-102,25,80,9);c.fill();
  c.fillStyle='#7a5a2c';c.fillRect(-27,-62,25,5);
  straw(c,-14,-22,-.3,1,5,16);straw(c,14,-22,.3,1,5,16);
  const sh=SC_SHIRT[L.shirt%6];

function handle(m,from){ // läuft nur beim Gastgeber
  const p=room.players[from];
  switch(m.t){
    case 'hello':room.players[from]={id:from,name:String(m.name||'Gast').slice(0,14),hat:m.hat|0,col:m.col|0,x:900,y:760,d:1,e:'',en:0,l:0,mode:'patch'};break;
    case 'pos':if(p&&m.m===room.mode){p.x=m.x;p.y=m.y;p.d=m.d;if(m.l!=null)p.l=m.l;p.h=m.h}break;
    case 'emote':if(p){p.e=String(m.e).slice(0,24);p.en++}break;
    case 'start':startGame(m.g);break;
    case 'home':startGame('patch');break;
    case 'cut':room.carve.ops.push(m.op);if(from!==me.id)carve.dirty=true;else carve.dirty=true;bcast({t:'cut',op:m.op,from});break;
    case 'cclear':room.carve.ops=[];carve.dirty=true;bcast({t:'cclear'});break;
    case 'candle':room.carve.lit=!!m.lit;break;
    case 'sc':if(room.mode==='scare'&&room.phase==='dress'){const s=room.scare[from]||(room.scare[from]={ready:false,vote:null});Object.assign(s,{hat:m.hat,face:m.face,shirt:m.shirt,acc:m.acc});if(m.init===false)s.ready=false;checkScare()}break;
    case 'ready':if(room.scare[from]){room.scare[from].ready=!!m.v;checkScare()}break;
    case 'vote':if(room.phase==='vote'&&room.scare[from]&&m.to!==from&&room.scare[m.to]){room.scare[from].vote=m.to;checkScare()}break;
    case 'fin':if(room.mode==='maze'&&p&&!room.fin.some(f=>f.id===from))room.fin.push({id:from,name:p.name});break;
  }
}
function checkScare(){
  if(room.mode!=='scare')return;const ids=Object.keys(room.players);
  if(room.phase==='dress'&&ids.length&&ids.every(i=>room.scare[i]&&room.scare[i].ready)){room.phase='vote';ids.forEach(i=>room.scare[i].vote=null);
    if(ids.length<2)room.phase='result'}
  else if(room.phase==='vote'&&ids.every(i=>room.scare[i]&&room.scare[i].vote))room.phase='result';
}
function startGame(g){
  room.mode=g;room.seed=(Math.random()*1e9)|0;room.phase='dress';room.fin=[];room.scare={};
  if(g==='carve'){room.carve.ops=[];room.carve.lit=false}

function dropPlayer(id){delete room.players[id];delete room.scare[id];

  const modeChanged=s.mode!==room.mode||s.seed!==room.seed;
  room.phase=s.phase;room.fin=s.fin;room.scare=s.scare;room.carve.lit=s.lit;
  for(const id in s.p){const n=s.p[id],o=room.players[id]||(room.players[id]={rx:n.x,ry:n.y,seen:n.en});
    Object.assign(o,{id,name:n.name,hat:n.hat,col:n.col,e:n.e,en:n.en,h:n.h});
    if(id!==me.id){o.x=n.x;o.y=n.y;o.d=n.d;o.l=n.l}}

}

function hostGame(){
  me.name=$('#name').value.trim()||'Gast';try{localStorage.kh_name=me.name}catch(e){}
  isHost=true;me.id='H';let done=false;
  const go=(code)=>{if(done)return;done=true;room.code=code||'';beginSession()};
  const attempt=n=>{
    if(!window.Peer){setStatus('Keine Internetverbindung zum Verbinden – Sie spielen allein.');go('');return}
    peer=new Peer(PFX+randCode());
    const code=peer.id?peer.id.slice(PFX.length):null;
    peer.on('open',id=>{peer.on('connection',onConn);go(id.slice(PFX.length))});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&n<5){attempt(n+1)}else if(!done){setStatus('Der Verbindungsdienst antwortet nicht – Sie spielen allein.');go('')}else toast('Verbindungsproblem: '+e.type)});
    setTimeout(()=>{if(!done){setStatus('Der Verbindungsdienst antwortet nicht – Sie spielen allein.');go('')}},9000);
  };
  setStatus('Hof wird eröffnet …');attempt(0);
}
function onConn(conn){
  conn.on('open',()=>{
    if(conns.length+1>=MAXP){conn.send({t:'full'});setTimeout(()=>conn.close(),300);return}
    conns.push(conn);
    conn.send({t:'welcome',ops:room.carve.ops});
  });
  conn.on('data',m=>{handle(m,conn.peer);if(m.t==='hello'){toast((room.players[conn.peer]?.name||'Jemand')+' ist dem Hof beigetreten');bcast(stateMsg())}});
  const gone=()=>{conns=conns.filter(c=>c!==conn);if(room.players[conn.peer]){toast(room.players[conn.peer].name+' hat den Hof verlassen');dropPlayer(conn.peer)}};

}
function joinGame(code){
  me.name=$('#name').value.trim()||'Gast';try{localStorage.kh_name=me.name}catch(e){}
  code=code.toUpperCase().trim();if(code.length!==4){setStatus('Bitte den 4-stelligen Code eingeben.');return}
  if(!window.Peer){setStatus('Verbindungsdienst konnte nicht geladen werden. Bitte Internet prüfen.');return}
  setStatus('Verbinde …');let ok=false;
  peer=new Peer();
  peer.on('open',id=>{me.id=id;
    hostConn=peer.connect(PFX+code,{reliable:true});
    hostConn.on('open',()=>{ok=true;hostConn.send({t:'hello',name:me.name,hat:me.hat,col:me.col})});
    hostConn.on('data',onHostMsg);
    hostConn.on('close',()=>{if(started){toast('Verbindung zum Hof getrennt');setTimeout(()=>location.reload(),1800)}});
  });
  peer.on('error',e=>{setStatus(e.type==='peer-unavailable'?'Diesen Hof gibt es nicht. Bitte den Code prüfen.':'Verbindung fehlgeschlagen ('+e.type+').')});

  g[0][0].w=0;g[ROWS-1][COLS-1].e=0;
  const dist=Array.from({length:ROWS},()=>Array(COLS).fill(-1)),q=[[0,0]];dist[0][0]=0;
  while(q.length){const[x,y]=q.shift();for(const[k,[dx,dy]]of Object.entries(D)){if(g[y][x][k])continue;const nx=x+dx,ny=y+dy;if(dist[ny]&&dist[ny][nx]===-1){dist[ny][nx]=dist[y][x]+1;q.push([nx,ny])}}}
  const cand=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(dist[y][x]>=10&&!(x===COLS-1&&y===ROWS-1))cand.push([x,y]);

}

  for(const id in room.players){const p=room.players[id];let x,y,d,mv,t;
    if(id===me.id){x=loc.x;y=loc.y;d=loc.d;mv=loc.moving;t=loc.t}else{p.rx=lerp(p.rx??p.x,p.x,.22);p.ry=lerp(p.ry??p.y,p.y,.22);x=p.rx;y=p.ry;d=p.d||1;mv=Math.hypot(p.x-p.rx,p.y-p.ry)>1.5;t=T;if(mv)p.wt=(p.wt||0)+dtG;t=p.wt||0}
    ents.push({y,f:()=>{drawChar(c,x,y,{col:p.col,hat:p.hat,d,moving:mv,t:id===me.id?t:(p.wt||T),s:1});nameTag(c,x,y-84,p.name+(id===me.id?' (Sie)':''),bubble(p))}})}
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  c.restore();
  // Wolkenschatten & Licht
  const sh=c.createLinearGradient(0,0,VW,VH);sh.addColorStop(0,'rgba(255,230,160,.18)');sh.addColorStop(.5,'rgba(255,200,120,0)');sh.addColorStop(1,'rgba(90,40,0,.16)');c.fillStyle=sh;c.fillRect(0,0,VW,VH);
  ptr.world=true;ptr.wx=cam.x+(ptr.x-VW/2)/cam.sc;ptr.wy=cam.y+(ptr.y-VH/2)/cam.sc;
}
function overlayFX(c){
  leaves.forEach(l=>{l.x+=l.vx*dtG;l.y+=l.vy*dtG+Math.sin(T+l.a)*.4;l.a+=l.va*dtG;if(l.x>VW+20||l.y>VH+20){l.x=-20;l.y=Math.random()*VH*.8-VH*.2}
    c.save();c.translate(l.x,l.y);c.rotate(l.a);c.fillStyle=l.col;c.beginPath();c.ellipse(0,0,l.r,l.r*.5,0,0,TAU);c.fill();c.strokeStyle='rgba(60,20,0,.4)';c.lineWidth=.8;c.beginPath();c.moveTo(-l.r,0);c.lineTo(l.r,0);c.stroke();c.restore()});
  const v=c.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.8);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(50,20,0,.32)');c.fillStyle=v;c.fillRect(0,0,VW,VH);
}
function updateChips(){
  const ids=Object.keys(room.players),sig=ids.map(i=>i+room.players[i].name+room.players[i].col+(i===me.id)).join('|');
  if(updateChips.sig===sig)return;updateChips.sig=sig;
  $('#chips').innerHTML=ids.map(i=>`<div class="chip"><i style="background:${COATS[room.players[i].col%8]}"></i>${room.players[i].name.replace(/[<>&]/g,'')}</div>`).join('');
}
const prev=$('#prev'),pc=prev.getContext('2d');
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;dtG=dt;T+=dt;
  if(!worldCv)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!started){drawPatch(ctx,true);overlayFX(ctx);
    pc.clearRect(0,0,140,170);drawChar(pc,70,150,{col:me.col,hat:me.hat,d:1,t:T,s:1.7});return}
  if(room.mode==='patch'){updatePatch(dt);drawPatch(ctx,false);overlayFX(ctx)}
  else if(room.mode==='maze'){updateMaze(dt);drawMaze(ctx)}
  else if(room.mode==='carve'){drawCarve(ctx)}
  else if(room.mode==='scare'){drawScare(ctx)}
  updateChips();
  // eigene Position senden
  if(now-lastNet>66){lastNet=now;
    let m={t:'pos',m:room.mode,d:loc.d};
    if(room.mode==='patch'){m.x=Math.round(loc.x);m.y=Math.round(loc.y)}
    else if(room.mode==='maze'){m.x=+mz.fx.toFixed(2);m.y=+mz.fy.toFixed(2);m.l=mz.l}
    else if(room.mode==='carve'){if(carve.hx!=null){m.x=carve.hx;m.y=carve.hy;m.h=1}else{m.x=0;m.y=0;m.h=0}}
    else m=null;
    if(m){const p=room.players[me.id];if(p&&isHost){Object.assign(p,{x:m.x,y:m.y,d:m.d,h:m.h})}else if(m)send(m)}}
}

/* ================= Eingaben ================= */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();keys.add(k);
  if([' ','enter','e'].includes(k)){launch();e.preventDefault()}
  if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{ptr.down=true;ptr.x=e.clientX;ptr.y=e.clientY;cv.setPointerCapture(e.pointerId);
  mz.sx=e.clientX;mz.sy=e.clientY;
  if(room.mode==='carve')carveDown(e);if(room.mode==='scare')scareClick(e)});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;
  if(room.mode==='carve'){const[x,y]=carveXY(e.clientX,e.clientY);carve.hx=Math.round(x);carve.hy=Math.round(y);if(carve.cur&&ptr.down){carve.cur.pts.push([x,y])}}});
cv.addEventListener('pointerup',e=>{ptr.down=false;
  if(room.mode==='carve'&&carve.cur){const op=carve.cur;carve.cur=null;addOp(op)}
  if(room.mode==='maze'&&mz.sx!=null){const dx=e.clientX-mz.sx,dy=e.clientY-mz.sy;if(Math.max(Math.abs(dx),Math.abs(dy))>24)mz.sw=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');mz.sx=null}});
cv.addEventListener('pointerleave',()=>{carve.hx=null});
document.querySelectorAll('#dpad button').forEach(b=>{
  const on=e=>{mz.dpad=b.dataset.d;e.preventDefault()},off=()=>{if(mz.dpad===b.dataset.d)mz.dpad=null};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});

/* ================= Lobby ================= */
$('#hatPrev').onclick=()=>me.hat=(me.hat+5)%6;$('#hatNext').onclick=()=>me.hat=(me.hat+1)%6;
$('#colPrev').onclick=()=>me.col=(me.col+7)%8;$('#colNext').onclick=()=>me.col=(me.col+1)%8;
$('#hostBtn').onclick=()=>{$('#hostBtn').disabled=true;$('#joinBtn').disabled=true;hostGame()};
$('#joinBtn').onclick=()=>joinGame($('#code').value);
$('#code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,''));
try{$('#name').value=localStorage.kh_name||''}catch(e){}
if(/^#[A-Za-z]{4}$/.test(location.hash)){$('#code').value=location.hash.slice(1).toUpperCase();setStatus('Name eingeben und auf „Beitreten“ tippen.')}
me.hat=Math.floor(Math.random()*6);me.col=Math.floor(Math.random()*8);

/* Start */
let booted=false;
function boot(){if(booted)return;booted=true;buildWorld();requestAnimationFrame(frame)}
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load("700 20px Fredoka"),new Promise(r=>setTimeout(r,1800))]).then(boot,boot)}else boot();
window.__kh={room,me,loc,startGame,send,enterMode,mz,carve,get started(){return started}};
</script>
</body>
</html>
